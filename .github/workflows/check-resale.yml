# Hourly site check + notification queueing. GitHub's runners have normal
# internet access (this site is unreachable from the Claude Code Remote
# environments available on this account -- org egress policy), so this
# workflow does the actual scraping and queues any new listing into
# state/pending_notifications.json. A separate Claude Code Remote Routine
# (which can push to the Claude app but can't reach this site) drains that
# queue on its own schedule and sends the actual push notifications. See
# README "Resale listing watcher".
name: Check Oktoberfest resale listings

on:
  schedule:
    - cron: "7 * * * *" # hourly, offset from the hour to avoid GitHub's busy top-of-hour slot
  workflow_dispatch:
    inputs:
      date:
        description: "Date to check (YYYY-MM-DD)"
        required: false
        default: "2026-09-26"
      notify_via:
        description: "Notification channel (file = queue for the Claude Routine, ntfy = direct ntfy.sh post)"
        type: choice
        options:
          - file
          - ntfy
        default: file

permissions:
  contents: write

concurrency:
  group: "resale-check"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Run resale check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          DATE="${DATE:-2026-09-26}"
          NOTIFY_VIA="${{ github.event.inputs.notify_via }}"
          NOTIFY_VIA="${NOTIFY_VIA:-file}"
          python check_resale.py --date "$DATE" --notify-via "$NOTIFY_VIA"

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update resale watcher state [skip ci]"
            git push
          fi
