# Watches oktoberfest-booking.com for new resale table offers on a target
# date and pushes straight to your phone via ntfy.sh.
#
# Design notes, since the previous version of this file was switched off:
#
#  * One stage, not two. The old flow queued hits into a committed JSON file
#    for a separate hourly Claude Routine to relay, which cost Claude usage
#    every hour forever, added 15-20 minutes of lag, and broke whenever
#    Remote Control disconnected. ntfy posts direct from this runner.
#  * No failure emails. A transient bad page load no longer fails the job --
#    that noise is why automatic checks got removed. Real breakage is
#    reported by a throttled push alarm from the script instead.
#  * State is committed only when it actually changes, so quiet periods
#    produce no commits at all.
name: Check Oktoberfest resale listings

on:
  schedule:
    # Every 10 minutes, deliberately off the :00/:30 marks.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to check (YYYY-MM-DD)"
        required: false
        default: "2026-09-26"
      notify_via:
        description: "ntfy = push to your phone, stdout = dry run (log only)"
        type: choice
        options:
          - ntfy
          - stdout
        default: ntfy
      show_all:
        description: "Also log every offer found for every date"
        type: boolean
        default: false
      dump:
        description: "Recon mode: dump the site's raw rendered markup to the log"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "resale-check"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      # Cheap guard against a silent regression in the offer parser: runs
      # against a fixture captured from the real site.
      - name: Parser self-test
        run: python check_resale.py --self-test

      - name: Run resale check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          DATE="${{ inputs.date }}"
          DATE="${DATE:-2026-09-26}"

          if [ "${{ inputs.dump }}" = "true" ]; then
            python recon_resale.py --date "$DATE" --body-chars 18000
            exit 0
          fi

          NOTIFY_VIA="${{ inputs.notify_via }}"
          NOTIFY_VIA="${NOTIFY_VIA:-ntfy}"

          SHOW_ALL=""
          if [ "${{ inputs.show_all }}" = "true" ]; then
            SHOW_ALL="--show-all"
          fi

          if [ "$NOTIFY_VIA" = "ntfy" ] && [ -z "$NTFY_TOPIC" ]; then
            echo "::error::NTFY_TOPIC secret is not set -- add it under Settings > Secrets and variables > Actions, or run with notify_via=stdout."
            exit 1
          fi

          # A bad page load must not fail the job: scheduled-workflow failures
          # send email on every occurrence, and that noise is what got the
          # previous automation disabled. The script raises a throttled push
          # alarm for genuine breakage instead.
          set +e
          python check_resale.py --date "$DATE" --notify-via "$NOTIFY_VIA" $SHOW_ALL
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "::warning::Check returned $CODE (site unreachable or parsing broke). A push alarm is sent at most once per 12h."
          fi

      - name: Persist state (only when it changed)
        if: ${{ inputs.dump != 'true' }}
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update resale watcher state [skip ci]"
            git push
          else
            echo "No state change -- nothing to commit."
          fi
