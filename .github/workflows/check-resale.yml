name: Check Oktoberfest resale listings

on:
  schedule:
    - cron: "7 * * * *" # hourly, offset from the hour to avoid GitHub's busy top-of-hour slot
  workflow_dispatch:
    inputs:
      date:
        description: "Date to check (YYYY-MM-DD)"
        required: false
        default: "2026-09-26"

permissions:
  contents: write

concurrency:
  group: "resale-check"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Run resale check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          DATE="${DATE:-2026-09-26}"
          python check_resale.py --date "$DATE"

      - name: Persist seen-listings state
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update seen resale listings state [skip ci]"
            git push
          fi
